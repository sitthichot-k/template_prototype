# =============================================================================
#  Frontend container nginx config.
#  Serves the built SPA and proxies /api to the backend service so that the
#  browser only ever talks to one origin (no CORS in preprod/production).
#  Listens on 8080 so the container can run as a non-root user.
#
#  Source of truth. The generator copies this file into the frontend build
#  context (`<frontend>/nginx/default.conf`), because a Dockerfile can only
#  COPY from inside its own context. `make verify` fails if the two drift.
# =============================================================================

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # --- Hardening -----------------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "DENY"               always;
    add_header Referrer-Policy          "no-referrer"        always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"      always;

    # Content-Security-Policy: deny by default, widened per project.
    #
    # The three CSP_*_EXTRA slots below are substituted at image build time
    # from build args, which come from the tier's env file. They are empty by
    # default, so a project that adds nothing gets exactly the policy this
    # template has always shipped.
    #
    # Adding a fourth slot means adding it to the envsubst list in the
    # frontend Dockerfile as well; the build fails loudly if you forget.
    #
    # Only the directives a real application needs to widen are exposed.
    # `default-src`, `script-src`, `frame-ancestors` and `base-uri` are
    # deliberately not: a project adding a map or a font must not be able to
    # weaken clickjacking or script-injection defences on the way past.
    #
    # Substitution happens at build rather than through nginx's own
    # /etc/nginx/templates mechanism, which writes into /etc/nginx/conf.d at
    # container start. The production overlay runs this container read-only,
    # as a non-root user, with cap_drop ALL - that write cannot succeed.
    #
    # Example, for a project embedding an OpenStreetMap-backed map:
    #   CSP_IMG_SRC_EXTRA=https://*.tile.openstreetmap.org
    #   CSP_CONNECT_SRC_EXTRA=https://*.githubusercontent.com
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${CSP_IMG_SRC_EXTRA}; font-src 'self' data: ${CSP_FONT_SRC_EXTRA}; connect-src 'self' ${CSP_CONNECT_SRC_EXTRA}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # --- Container healthcheck ----------------------------------------------
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # --- API passthrough -----------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # --- Immutable hashed assets --------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA history fallback ------------------------------------------------
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
