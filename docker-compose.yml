# =============================================================================
#  BASE COMPOSE  -  shared service topology for every tier.
#  Never run this file alone. Always layer exactly one tier overlay:
#
#    docker compose --env-file .env.local \
#      -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
#  See ENVIRONMENTS.md, or use ./scripts/compose.sh <tier> <command>.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-app}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # MongoDB - primary datastore
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    <<: *default-restart
    logging: *default-logging
    command: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-app}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data

  # ---------------------------------------------------------------------------
  # Redis - cache, session store, rate-limit counters, job queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: *default-restart
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - data

  # ---------------------------------------------------------------------------
  # Backend API - Node.js / Express
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    image: ${REGISTRY:-local}/${IMAGE_NAMESPACE:-platform}/${PROJECT_CODE:-app}-backend:${IMAGE_TAG:-latest}
    <<: *default-restart
    logging: *default-logging
    env_file:
      - ${BACKEND_ENV_FILE:-./backend-node/.env.local}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-local}
      PORT: 8080
      # Service discovery inside the compose network overrides any host value
      # that may be present in the per-service env file.
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DATABASE:-app}?authSource=${MONGO_DATABASE:-app}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - data
      - edge

  # ---------------------------------------------------------------------------
  # Frontend - built SPA served by nginx. FRONTEND_CONTEXT points at the app's
  # build directory; it is a variable so the path is stated in one place.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-./frontend-vue}
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
        # Content-Security-Policy extension points, baked into the image at
        # build time. Empty unless the tier's env file widens them; see the
        # comment block in infra/nginx/default.conf.
        CSP_IMG_SRC_EXTRA: ${CSP_IMG_SRC_EXTRA:-}
        CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
        CSP_FONT_SRC_EXTRA: ${CSP_FONT_SRC_EXTRA:-}
    image: ${REGISTRY:-local}/${IMAGE_NAMESPACE:-platform}/${PROJECT_CODE:-app}-frontend:${IMAGE_TAG:-latest}
    <<: *default-restart
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge

networks:
  # Datastores are reachable only from services that need them.
  data:
    driver: bridge
    internal: false
  edge:
    driver: bridge

volumes:
  mongo-data:
  mongo-config:
  redis-data:
